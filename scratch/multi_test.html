<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<style>
  @page { size: 1920px 1080px; margin: 0; }
  body { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; }
  .page { width: 1920px; height: 1080px; box-sizing: border-box; page-break-after: always; break-after: page; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
  <div class='page' style='background:#111;'><h1>PAGE 1</h1></div>
  <div class='page' style='background:#222;'><h1>PAGE 2</h1></div>
</body>
</html>
